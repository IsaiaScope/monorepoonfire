<!doctype html>
<!-- Declares this as an HTML5 document -->
<html lang="en-GB" translate="no">
  <!-- Sets the document language to British English for accessibility and SEO -->
  <head>
    <!-- Document character encoding - UTF-8 supports all Unicode characters -->
    <meta charset="UTF-8" />

    <!-- Tells the browser to respect system dark/light mode preferences -->
    <!-- This enables automatic theme switching based on user's OS settings -->
    <meta name="color-scheme" content="light dark" />

    <!-- Enhanced viewport configuration for mobile devices with accessibility support -->
    <!-- viewport-fit=cover: Content extends to screen edges (handles notches on iPhone X+) -->
    <!-- width=device-width: Uses device's actual width instead of default 980px -->
    <!-- initial-scale=1.0: Sets initial zoom level to 100% -->
    <!-- maximum-scale=5.0: Allows users to zoom up to 500% for accessibility -->
    <!-- user-scalable=yes: Enables pinch-to-zoom for users with low vision -->
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />

    <!-- Prevents automatic phone number detection on mobile browsers -->
    <!-- Stops browsers from making phone numbers clickable automatically -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Disables the tap highlight effect on Windows Phone -->
    <!-- Removes the gray highlight when tapping elements on Windows mobile -->
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Page title optimized for search variations -->
    <title>Isaia Riva</title>

    <!-- Meta description optimized for name search variations -->
    <meta
      name="description"
      content="Isaia Riva (Riva Isaia) - Professional Senior Front End Developer Portfolio. Discover projects, skills, and experience of senior frontend developer Isaia Riva. Contact for collaboration opportunities."
    />

    <!-- Keywords for better search visibility -->
    <meta
      name="keywords"
      content="Isaia Riva, Riva Isaia, Isaia Riva Portfolio, Senior Front End Developer, Frontend Developer, React Developer, JavaScript Developer, Senior Developer"
    />

    <!-- Author information -->
    <meta name="author" content="Isaia Riva" />

    <!-- Canonical URL to prefer www.isaiariva.com in search results -->
    <link rel="canonical" href="https://www.isaiariva.com/" />

    <!-- Open Graph meta tags for social media sharing -->
    <meta property="og:title" content="Isaia Riva - Senior Front End Developer Portfolio" />
    <meta
      property="og:description"
      content="Professional portfolio of Isaia Riva (Riva Isaia), Senior Front End Developer specializing in modern web technologies."
    />
    <meta property="og:url" content="https://www.isaiariva.com/" />
    <meta property="og:site_name" content="Isaia Riva Portfolio" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.isaiariva.com/android-chrome-512x512.png" />
    <meta property="og:image:alt" content="Isaia Riva Portfolio Logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Isaia Riva - Senior Front End Developer Portfolio" />
    <meta
      name="twitter:description"
      content="Professional portfolio of Isaia Riva (Riva Isaia), Senior Front End Developer with expertise in modern web technologies."
    />
    <meta name="twitter:image" content="https://www.isaiariva.com/android-chrome-512x512.png" />
    <meta name="twitter:image:alt" content="Isaia Riva Portfolio Logo" />
    <meta name="twitter:site" content="@isaiariva" />
    <meta name="twitter:creator" content="@isaiariva" />

    <!-- Theme color for browser UI elements (address bar, etc.) -->
    <!-- This color appears in browser chrome and app switcher on mobile -->
    <meta name="theme-color" content="#000000" />

    <!-- Web App Manifest for PWA functionality -->
    <!-- Links to manifest.json which defines app behavior when installed -->
    <!-- iOS uses manifest.json "short_name" for home screen app title -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Standard ICO favicon for older browsers and Windows -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- PNG favicons for modern browsers with size specifications -->
    <!-- Multiple sizes ensure optimal display across different contexts -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- SVG favicon for browsers that support vector graphics -->
    <!-- Scales perfectly at any size and supports dark mode -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apple Touch Icon for iOS home screen when app is bookmarked -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />

    <!-- Fallback Apple Touch Icon without size specified -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- iOS-specific meta tags for enhanced web app experience -->

    <!-- Modern meta tag for web app capabilities -->
    <!-- Enables fullscreen mode when app is added to home screen -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Legacy iOS support (kept for backward compatibility) -->
    <!-- Enables fullscreen mode when app is added to iOS home screen -->
    <!-- Removes Safari UI elements for native app-like experience -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Sets the title that appears when the app is added to iOS home screen -->
    <meta name="apple-mobile-web-app-title" content="Isaia Riva" />

    <!-- Controls the appearance of the status bar in iOS web apps -->
    <!-- 'black': Black status bar with white text -->
    <!-- 'default': Default status bar -->
    <!-- 'black-translucent': Black translucent status bar (content goes behind it) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Enhanced Structured Data for Google Search -->

    <script type="application/ld+json">

    <!-- Enhanced SEO and Indexing Control -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="bingbot" content="index, follow" />

    <!-- Geographic and Language Targeting -->
    <meta name="geo.region" content="IT" />
    <meta name="geo.country" content="Italy" />
    <meta name="language" content="English" />
    <meta name="content-language" content="en" />

    <!-- Professional and Contact Information -->
    <meta name="classification" content="Portfolio, Web Developer, Senior Front End Developer" />
    <meta name="category" content="Technology, Web Development, Portfolio" />
    <meta name="coverage" content="Worldwide" />
    <meta name="distribution" content="Global" />
    <meta name="rating" content="General" />

    <!-- Additional Discovery Meta Tags -->
    <meta name="revisit-after" content="7 days" />
    <meta name="expires" content="never" />
    <meta name="cache-control" content="public" />

    <!-- Professional Skills for Search -->
    <meta name="skills" content="React, TypeScript, JavaScript, HTML5, CSS3, Frontend Development, Senior Developer" />
    <meta name="experience" content="Senior Front End Developer, Web Development, React Development" />
  </head>

  <!-- Document body - contains all visible page content -->
  <body>
    <!-- Main application container where React will mount -->
    <div id="app"></div>

    <!-- Entry point for the React application -->
    <!-- type="module" enables ES6 module imports -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
