<!doctype html>
<!-- Declares this as an HTML5 document -->
<html lang="en-GB" translate="no">
  <!-- Sets the document language to British English for accessibility and SEO -->
  <head>
    <!-- Document character encoding - UTF-8 supports all Unicode characters -->
    <meta charset="UTF-8" />

    <!-- Tells the browser to respect system dark/light mode preferences -->
    <!-- This enables automatic theme switching based on user's OS settings -->
    <meta name="color-scheme" content="light dark" />

    <!-- Preconnect to external resources for performance optimization -->
    <!-- Preconnect establishes early connections to improve loading speed -->
    <link rel="preconnect" href="https://monorepoonfire.up.railway.app" crossorigin />
    <link rel="preconnect" href="https://railway.app" crossorigin />
    <link rel="dns-prefetch" href="https://monorepoonfire.up.railway.app" />
    <link rel="dns-prefetch" href="https://railway.app" />

    <!-- Enhanced viewport configuration for mobile devices with accessibility support -->
    <!-- viewport-fit=cover: Content extends to screen edges (handles notches on iPhone X+) -->
    <!-- width=device-width: Uses device's actual width instead of default 980px -->
    <!-- initial-scale=1.0: Sets initial zoom level to 100% -->
    <!-- maximum-scale=5.0: Allows users to zoom up to 500% for accessibility -->
    <!-- user-scalable=yes: Enables pinch-to-zoom for users with low vision -->
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />

    <!-- Prevents automatic phone number detection on mobile browsers -->
    <!-- Stops browsers from making phone numbers clickable automatically -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Disables the tap highlight effect on Windows Phone -->
    <!-- Removes the gray highlight when tapping elements on Windows mobile -->
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Page title that appears in browser tabs and search results -->
    <title>Riva Isaia</title>

    <!-- Meta description for SEO - appears in search engine results -->
    <meta name="description" content="Web site to show Riva Isaia portfolio" />

    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Riva Isaia - Portfolio" />
    <meta name="twitter:description" content="Web site to show Riva Isaia portfolio" />
    <meta name="twitter:image" content="/android-chrome-512x512.png" />
    <meta name="twitter:image:alt" content="Riva Isaia Portfolio Logo" />

    <!-- Theme color for browser UI elements (address bar, etc.) -->
    <!-- This color appears in browser chrome and app switcher on mobile -->
    <meta name="theme-color" content="#000000" />

    <!-- Web App Manifest for PWA functionality -->
    <!-- Links to manifest.json which defines app behavior when installed -->
    <!-- iOS uses manifest.json "short_name" for home screen app title -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Standard ICO favicon for older browsers and Windows -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- PNG favicons for modern browsers with size specifications -->
    <!-- Multiple sizes ensure optimal display across different contexts -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- SVG favicon for browsers that support vector graphics -->
    <!-- Scales perfectly at any size and supports dark mode -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apple Touch Icon for iOS home screen when app is bookmarked -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />

    <!-- Fallback Apple Touch Icon without size specified -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- iOS-specific meta tags for enhanced web app experience -->

    <!-- Modern meta tag for web app capabilities -->
    <!-- Enables fullscreen mode when app is added to home screen -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Legacy iOS support (kept for backward compatibility) -->
    <!-- Enables fullscreen mode when app is added to iOS home screen -->
    <!-- Removes Safari UI elements for native app-like experience -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Sets the title that appears when the app is added to iOS home screen -->
    <meta name="apple-mobile-web-app-title" content="Isaia Riva" />

    <!-- Controls the appearance of the status bar in iOS web apps -->
    <!-- 'black': Black status bar with white text -->
    <!-- 'default': Default status bar -->
    <!-- 'black-translucent': Black translucent status bar (content goes behind it) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <!-- Document body - contains all visible page content -->
  <body>
    <!-- Main application container where React will mount -->
    <div id="app"></div>

    <!-- Entry point for the React application -->
    <!-- type="module" enables ES6 module imports -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
