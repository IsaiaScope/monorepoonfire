name: CI-dev
run-name: ${{ github.actor }} is running CI-dev
description: |
  This workflow runs on pushes to the 'dev' branch, installs dependencies, builds the project, and runs devs using pnpm.

on:
  push:
    branches: [dev]

jobs:
  create-dotenv:
    name: create environment file
    runs-on: ubuntu-latest
    # Use the environment specified by the caller (so it pulls the right variables)
    environment: env
    env:
      ENV: ${{ vars.ENV }}
      PORT: ${{ vars.PORT }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}

    steps:
      # creates the directory src/environment if it does not already exist.

      # The -p flag means "no error if existing, make parent directories as needed."
      # This ensures that the folder structure is present before writing the .env file into it.
      - name: Create environment directory
        run: mkdir -p src/environment

      - name: Print environment variables
        run: |
          echo "ENV: $ENV"
          echo "PORT: $PORT"
          echo "LOG_LEVEL: $LOG_LEVEL"
          echo "DATABASE_URL: $DATABASE_URL"

      # Write environment variables from GitHub environment to the specified .env file
      - name: Create .env file
        run: |
          echo "Creating .env file: src/environment/.env"
          echo "ENV=${{ vars.ENV }}" >> src/environment/.env
          echo "PORT=${{ vars.PORT }}" >> src/environment/.env
          echo "LOG_LEVEL=${{ vars.LOG_LEVEL }}" >> src/environment/.env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> src/environment/.env

  build:
    name: test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm run test

      - name: Run build
        run: pnpm run build
