name: CI-dev
run-name: ${{ github.actor }} is running CI-dev
description: |
  This workflow runs on pushes to the 'dev' branch, installs dependencies, builds the project, and runs devs using pnpm.

on:
  push:
    branches: [dev]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    environment: env
    env:
      ENV: ${{ vars.ENV }}
      PORT: ${{ vars.PORT }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Create .env file for dev
        uses: ./.github/actions/create-environment
        with:
          env_name: dev
          env_file: .env

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install


      - name: Run tests
        run: pnpm run test

      - name: Run build
        run: pnpm run build
