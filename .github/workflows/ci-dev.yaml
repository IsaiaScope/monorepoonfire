name: CI-dev
run-name: ${{ github.actor }} is running CI-dev
description: |
  This workflow runs on pushes to the 'dev' branch, installs dependencies, builds the project, and runs devs using pnpm.

on:
  push:
    branches: [dev]

jobs:
  build:
    name: create environment file, test and build
    runs-on: ubuntu-latest
    environment: env
    env:
      ENV: ${{ vars.ENV }}
      PORT: ${{ vars.PORT }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      
      # creates the directory app/hono/src/environment if it does not already exist.

      # The -p flag means "no error if existing, make parent directories as needed."
      # This ensures that the folder structure is present before writing the .env file into it.
      - name: Create environment directory
        run: mkdir -p app/hono/src/environment

      - name: Create .env file
        run: |
          echo "ENV=${{ vars.ENV }}" > app/hono/src/environment/.env
          echo "PORT=${{ vars.PORT }}" >> app/hono/src/environment/.env
          echo "LOG_LEVEL=${{ vars.LOG_LEVEL }}" >> app/hono/src/environment/.env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> app/hono/src/environment/.env

      - name: Print project structure
        run: tree -a -L 5 || find . | head -40

      - name: Print .env file for debugging
        run: cat app/hono/src/environment/.env || echo ".env not found in app/hono/src/environment/"

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm run test

      - name: Run build
        run: pnpm run build