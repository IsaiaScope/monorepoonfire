name: CI-dev
run-name: ${{ github.actor }} is running CI-dev

description: |
  This workflow runs on pushes to the 'dev' branch, installs dependencies, builds the project, and runs tests using pnpm.

on:
  push:
    branches: [dev]

jobs:
  build:
    name: create environment file, test and build
    runs-on: ubuntu-latest
    environment: env
    env:
      ENV: ${{ vars.ENV }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create environment directory
        run: mkdir -p app/hono/src/environment

      - name: Create .env file
        run: |
          echo "ENV=${{ vars.ENV }}" > app/hono/src/environment/.env
          echo "LOG_LEVEL=${{ vars.LOG_LEVEL }}" >> app/hono/src/environment/.env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> app/hono/src/environment/.env

      - name: Print project structure
        run: tree -L 5 || find . | head -40

      - name: Print .env file for debugging
        run: cat app/hono/src/environment/.env || echo ".env not found in app/hono/src/environment/"

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm run test

      - name: Run build
        run: pnpm run build

      - name: Print project after build structure
        run: tree -L 5 || find . | head -40

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: hono-dist
          path: app/hono/dist

  deploy:
    name: Deploy to Render
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: hono-dist
          path: dist

      - name: List dist contents
        run: ls -R dist