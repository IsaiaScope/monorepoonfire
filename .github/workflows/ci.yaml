name: CI
run-name: ${{ github.actor }} is running CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  validate:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: monorepoonfire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create .env for hono
        run: |
          echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/monorepoonfire_test" > app/hono/src/environment/.env

      - name: Run database migrations
        run: pnpm --filter @app/hono db:migrate

      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t monorepoonfire:ci-check .
