name: CI-production
run-name: ${{ github.actor }} is running CI-production

on:
  push:
    branches: [production] # Triggers workflow only for pushes to the 'production' branch.

jobs:
  build:
    name: Build # Name of the job that will run in this workflow.
    runs-on: ubuntu-latest # Uses the latest Ubuntu runner provided by GitHub Actions.
    environment: env.production # Optionally specifies the environment for secrets/variables.
    env:
      # These environment variables are available to all steps in this job.
      ENV: ${{ vars.ENV }} # Custom variable, typically set in GitHub repo/environment.
      LOG_LEVEL: ${{ vars.LOG_LEVEL }} # Logging level for your app.
      DATABASE_URL: ${{ secrets.DATABASE_URL }} # Secret for your database connection string.
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }} # Secret for database authentication.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }} # Secret for TurboRepo (if used).
      TURBO_TEAM: ${{ vars.TURBO_TEAM }} # TurboRepo team variable.

    steps:
      # Step 1: Checks out your repository under $GITHUB_WORKSPACE, so your workflow can access it.
      - name: Checkout code
        uses: actions/checkout@v2 # Uses the official GitHub Action to clone your repo.

      # Step 2: Ensures the directory for environment files exists.
      # mkdir: Command to create directories.
      # -p: No error if existing, make parent directories as needed.
      - name: Create environment directory
        run: mkdir -p app/hono/src/environment # -p ensures no error if the directory exists.

      # Step 3: Creates the .env.production file with required variables.
      # echo: Writes environment variables to the file.
      # >: Overwrites the file if it exists.
      # >>: Appends to the file.
      - name: Create .env.production file
        run: |
          echo "ENV=${{ vars.ENV }}" > app/hono/src/environment/.env.production
          echo "LOG_LEVEL=${{ vars.LOG_LEVEL }}" >> app/hono/src/environment/.env.production 
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> app/hono/src/environment/.env.production
          echo "DATABASE_AUTH_TOKEN=${{ secrets.DATABASE_AUTH_TOKEN }}" >> app/hono/src/environment/.env.production

      # Step 4: Prints the project structure for debugging.
      # tree: Lists files in a tree-like format.
      # -a: All files, including hidden ones.
      # -L 8: Limit depth to 8 levels.
      # If tree is not available, fallback to find and head.
      # find: Lists all files and directories recursively.
      # head -40: Limits output to first 40 lines.
      - name: Print project tree before running tests and build
        run: tree -a -L 8 app/hono || find app/hono | head -40

      # Step 5: Prints the contents of the .env.production file for debugging.
      # cat: Displays file contents.
      # If the file does not exist, prints a message instead.
      - name: Print .env.production file for debugging
        run: cat app/hono/src/environment/.env.production || echo ".env.production not found in app/hono/src/environment/"

      # Step 6: Sets up the Node.js environment.
      # Uses the official GitHub Action for Node.js.
      # node-version: Specifies which version of Node.js to use.
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Specifies Node.js version 20.

      # Step 7: Installs pnpm globally using npm.
      # npm: Node package manager.
      # install -g: Installs package globally.
      - name: Install pnpm
        run: npm install -g pnpm # Installs pnpm globally for use in later steps.

      # Step 8: Installs project dependencies using pnpm.
      # pnpm: Fast, disk space efficient package manager.
      - name: Install dependencies
        run: pnpm install # Installs all dependencies listed in package.json.

      # Step 9: Builds your project using pnpm.
      # pnpm run: Runs a script defined in package.json.
      - name: Run build
        run: pnpm run build:production # Runs the build script.

      # Step 10: Prints the project structure for debugging after build.
      # tree: Lists files in a tree-like format.
      # -a: All files, including hidden ones.
      # -I 'node_modules': Ignores node_modules directories.
      # -L 8: Limit depth to 8 levels.
      # If tree is not available, fallback to find and head.
      # find: Lists all files and directories recursively.
      # grep -v node_modules: Excludes lines containing 'node_modules'.
      # head -40: Limits output to first 40 lines.
      - name: Print project tree after build
        run: tree -a -I 'node_modules' -L 8 app/hono || find app/hono | grep -v node_modules | head -40