name: CI-test
run-name: ${{ github.actor }} is running CI-test

on:
  push:
    branches: [test] # Triggers workflow only for pushes to the 'test' branch.

jobs:
  build:
    name: create environment file, test and build
    runs-on: ubuntu-latest # Uses the latest Ubuntu runner provided by GitHub Actions.
    environment: env.test # Optionally specifies the environment for secrets/variables.
    env:
      # These environment variables are available to all steps in this job.
      ENV: ${{ vars.ENV }} # Custom variable, typically set in GitHub repo/environment.
      LOG_LEVEL: ${{ vars.LOG_LEVEL }} # Logging level for your app.
      DATABASE_URL: ${{ secrets.DATABASE_URL }} # Secret for your database connection string.
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }} # Secret for TurboRepo (if used).
      TURBO_TEAM: ${{ vars.TURBO_TEAM }} # TurboRepo team variable.

    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your workflow can access it.
      - name: Checkout code
        uses: actions/checkout@v2

      # Ensures the directory for environment files exists.
      # -p: No error if existing, make parent directories as needed.
      - name: Create environment directory
        run: mkdir -p app/hono/src/environment

      # Creates the .env file with required variables.
      # >: Overwrites the file if it exists.
      # >>: Appends to the file.
      # Using echo to write each variable to the .env file.
      - name: Create .env.test file
        run: |
          echo "ENV=${{ vars.ENV }}" > app/hono/src/environment/.env.test
          echo "LOG_LEVEL=${{ vars.LOG_LEVEL }}" >> app/hono/src/environment/.env.test
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> app/hono/src/environment/.env.test
          echo "DATABASE_AUTH_TOKEN=${{ secrets.DATABASE_AUTH_TOKEN }}" >> app/hono/src/environment/.env.test

      # Prints the project structure for debugging.
      # tree: Lists files in a tree-like format.
      # -L 5: Limit depth to 5 levels.
      # If tree is not available, fallback to find and head to avoid too much output.
      - name: Print project structure
        run: tree -L 5 || find . | head -40

      # Prints the contents of the .env file for debugging.
      # If the file does not exist, prints a message instead.
      - name: Print .env file for debugging
        run: cat app/hono/src/environment/.env.test || echo ".env.test not found in app/hono/src/environment/"

      # Sets up the Node.js environment.
      # Uses the official GitHub Action for Node.js.
      # node-version: Specifies which version of Node.js to use.
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Installs pnpm globally using npm.
      # -g: Installs pnpm globally so it can be used in subsequent steps.
      - name: Install pnpm
        run: npm install -g pnpm

      # Installs project dependencies using pnpm.
      - name: Install dependencies
        run: pnpm install

      # Runs your test suite using pnpm.
      - name: Run tests
        run: pnpm run test

      # Builds your project using pnpm.
      - name: Run build
        run: pnpm run build

      # Prints the project structure for debugging.
      # tree: Lists files in a tree-like format.
      # -L 5: Limit depth to 5 levels.
      # If tree is not available, fallback to find and head to avoid too much output.
      - name: Print project after build structure
        run: tree -L 5 || find . | head -40