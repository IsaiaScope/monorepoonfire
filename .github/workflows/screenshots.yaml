name: Screenshots
run-name: ${{ github.actor }} is generating screenshots

on:
  push:
    branches: [production]

jobs:
  screenshots:
    name: Generate Screenshots
    runs-on: ubuntu-latest

    # Skip if the commit was an auto-generated screenshot update
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: monorepoonfire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Create .env for hono
        run: |
          echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/monorepoonfire_test" > app/hono/src/environment/.env

      - name: Run database migrations
        run: pnpm --filter @app/hono db:migrate

      - name: Seed database
        run: pnpm --filter @app/hono db:seed

      - name: Build portfolio
        run: pnpm --filter @app/portfolio build

      - name: Build hono
        run: pnpm --filter @app/hono build

      - name: Run E2E tests and generate screenshots
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/screenshots/
          if git diff --staged --quiet; then
            echo "No screenshot changes to commit"
          else
            git commit -m "ci(screenshots): update auto-generated screenshots

          [skip ci]"
            git push
          fi
